# Phase 3 DoD: what does real diarization cost? (CLAUDE.md §5 Phase 3)
#
# Runs all four arms over the SAME 150 test scenes in one pass, so every
# comparison is a paired difference on matched (scene, speaker, depth, system)
# rows and scene difficulty cancels exactly rather than being averaged over.
#
# The checkpoint is Phase 2's final scratch-trained curriculum one, UNCHANGED and
# with no mask augmentation. That is deliberate: Stage A measures the cost of
# real diarization on the extractor we already have, and only then does Stage B
# design augmentation against the measured error profile. Sizing a remedy before
# measuring the disease is how the first five Phase 2 runs got spent.
#
# Expect absolute SI-SDR to sit where Phase 2 left it (no_recursion ~-1.3 dB at
# depth 3 on this eval set) or below -- Phase 3's claims are RELATIVE, holding
# scenes, mixture and checkpoint fixed and varying only the diarizer.
#
#   DAGGER_DATA_ROOT=/mnt/data python scripts/run_phase3.py \
#       --config configs/phase3/dod/phase3_librimix_3spk_oracle_vs_real.yaml

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test.csv
  n_src: 3
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 150
  # Build a second, NATIVE 16 kHz mixture from the same placement for the
  # diarizer. pyannote community-1 is a 16 kHz model; upsampling the 8 kHz
  # mixture instead would invent nothing above 4 kHz, inflating DER for a reason
  # unrelated to diarization difficulty -- and that inflation would land straight
  # in the headline gap. The 8 kHz scene is bit-identical either way.
  diarizer_sample_rate: 16000

diarizer:
  name: pyannote
  model: pyannote/community-1
  # 'oracle' is mandatory (guardrail §6.2). The other three each vary exactly one
  # thing -- see scripts/run_phase3.py's docstring for the decomposition.
  arms: [oracle, real, real_forced_m, real_index_order]

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt

# Untuned Phase 2 defaults, ON PURPOSE for this run. V_i has been structurally
# zero in every run to date (one solo run -> one clip -> variance over one
# sample), so max_mean_variance has never once fired and cannot have been tuned.
# Real diarization fragments solo regions and brings it to life for the first
# time; this run MEASURES what it does at the default before Stage B tunes it on
# the dev split. Tuning on these test scenes and then reporting them is leakage.
gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

# Phase 2 closed with refinement net-harmful under CLEAN enrollment, so
# `refine.rounds: 0` is the default there. Kept at 2 here on purpose: the one
# regime never tested was CONTAMINATED enrollment, which is exactly what real
# diarization produces, and it is the regime V_i exists for.
refine:
  rounds: 2

eval:
  results_dir: results/phase3/dod
  tag: oracle_vs_real
