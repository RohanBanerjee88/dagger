# Phase 3 Stage B: turn `V_i` ON for the first time in the project's history.
#
# WHY THIS IS A SEPARATE CONFIG RATHER THAN AN EDIT.
# `phase3_librimix_3spk_long.yaml` produced the committed Stage A CSVs that every
# Phase 3 comparison pairs against. Editing its `gate:` block would mean those
# CSVs no longer regenerate from their own config, breaking CLAUDE.md §7 ("no
# numbers that can't be regenerated by one command"). So the baseline config is
# left untouched and this one differs from it by EXACTLY ONE LINE:
#
#     max_mean_variance: 0.05  ->  0.0001
#
# Everything else -- corpus, limit, arms, checkpoint, tau_margin, refine.rounds --
# is byte-identical to the baseline, so rows pair on
# (scene, speaker, depth, system) and the difference is attributable to the
# threshold alone.
#
# WHAT 1e-4 IS, AND WHERE IT CAME FROM.
# `tune_gate.py` on a long-scene dev-clean split (2026-08-20, the first run of
# that script ever) swept `mean_variance` against contaminated enrollment:
#
#     threshold   detection   false rej.   J
#     1e-5        100.0%      98.0%        +0.020
#     1e-4         45.3%       7.9%        +0.373   <- best
#     >= 5e-4       0.0%       0.0%         0.000
#
# Population medians: honest 0.00005, contaminated 0.00010. J = +0.373 clears
# tune_gate's 0.1 refusal bar comfortably.
#
# The shipped default of 0.05 sits **500x above the entire usable range**. That
# single fact is the whole explanation for four separate "V_i is structurally
# dead" conclusions in this project's history: `mean_variance` is nonzero under
# real diarization but never exceeds ~3e-4, so nothing ever fired. Each
# observation was right; each inference from it was wrong. The check was never
# dead -- it was never switched on.
#
# TWO THINGS TO EXPECT, so the result is not over-read.
#
# 1. `V_i` is a PARTIAL detector: 45.3% detection at a 7.9% false-rejection cost.
#    Roughly one in thirteen healthy enrollments will now be rejected, and a
#    false rejection costs real quality on every scene while a missed detection
#    costs only on contaminated ones. If the gated systems get WORSE here, that
#    is a legitimate outcome, not a bug.
#
# 2. `gate_cfg` is SHARED between `gated_deflation` and coarse_to_fine's
#    refinement gate. This config therefore moves both, and the two must be read
#    separately -- `gated_deflation` vs `ungated_deflation` for the gate, and
#    `coarse_to_fine` vs `no_recursion` for refinement.
#
# WHY THIS MATTERS MORE THAN IT LOOKS. `tau_margin` was confirmed inert on
# 2026-08-20 (J = +0.046, and the conditioning probe validated that fixture:
# clip50 steers at 9.41 dB). So `V_i` is now the ONLY live check in the gate --
# meaning `gated_deflation` has been differing from `ungated_deflation` by
# almost nothing, and this run is the first where the gate does real work.
#
# THE THRESHOLD WILL NOT TRANSFER. The usable window is one order of magnitude
# wide (1e-5 and 5e-4 both give J ~ 0). Re-run `tune_gate.py` whenever the
# corpus or the checkpoint changes -- in particular after any Session C
# retraining, this value is void.
#
#   DAGGER_DATA_ROOT=/kaggle/working/data python scripts/run_phase3.py \
#       --config configs/phase3/experiments/phase3_librimix_3spk_vi_on.yaml

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test_long.csv
  n_src: 3
  placement: chain
  overlap: 0.3
  min_solo_ms: 1000.0
  limit: 50
  diarizer_sample_rate: 16000

diarizer:
  name: pyannote
  model: pyannote/speaker-diarization-community-1
  arms: [oracle, real, real_index_order]

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt

gate:
  tau_margin: 0.1          # unchanged, and confirmed inert -- see the header
  max_mean_variance: 0.0001   # THE ONE CHANGED LINE (was 0.05)
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2                # matches the Stage A baseline exactly

eval:
  results_dir: results/phase3/experiments
  tag: vi_on
