# Phase 3 Stage A: scheduled placement, but 3 s of solo per speaker.
#
# The second lever on the same hypothesis as the chain config -- that the
# 2026-08-16 collapse came from starving the diarizer of clean speech, not from
# pyannote being bad. The two configs separate the two things that changed:
#
#   chain      -> conversation-like geometry, but loses genuine depth-3 regions
#   longsolo   -> KEEPS the depth-3 overlap zone, just gives each speaker enough
#                 solo speech (3 s instead of 1 s) to be clusterable
#
# If chain recovers and longsolo does not, the problem is the near-continuous
# 3-way overlap itself. If both recover, it was simply solo duration, and the
# scheduled geometry stays usable for Phase 3 -- which matters, because it is the
# only geometry that produces depth 3 and therefore the only one where the full
# depth-stratified table exists.
#
# Cost: min_solo_ms 3000 makes the solo zone 9 s (3 speakers x 3 s) before the
# overlap zone starts, so scenes get longer and the run gets slower. Expect
# noticeably more than the scheduled run's wall time, and check the depth
# histogram -- if a scene's utterances are shorter than 3 s, that speaker
# contributes nothing to the overlap zone and depth 3 quietly disappears.
#
#   DAGGER_DATA_ROOT=/mnt/data python scripts/run_phase3.py \
#       --config configs/phase3/experiments/phase3_librimix_3spk_longsolo.yaml

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test.csv
  n_src: 3
  placement: scheduled
  # The one variable this config changes against the DoD run.
  min_solo_ms: 3000.0
  limit: 150
  diarizer_sample_rate: 16000

diarizer:
  name: pyannote
  model: pyannote/speaker-diarization-community-1
  arms: [oracle, real, real_forced_m, real_index_order]

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  results_dir: results/phase3/experiments
  tag: longsolo
