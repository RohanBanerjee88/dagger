# Phase 3 Stage B, run B2: the ORACLE-REFINEMENT CEILING.
#
# *** THIS RUN PRODUCES A NUMBER THAT IS NOT A SYSTEM. ***
# `refine.oracle_ceiling: true` makes `coarse_to_fine` accept a refinement
# candidate by comparing SI-SDR against the CLEAN SOURCES. It is scoring-time
# only and could never be deployed. Its rows are an upper bound on what any
# acceptance rule could achieve -- never quote them as a result.
#
# WHY IT EXISTS. Refinement is now measured net-negative in every regime tried:
#
#   clean enrollment (Phase 2)                 -0.07 to -0.54 dB
#   heterogeneous enrollment (Phase 2)         -0.36 / -0.69 dB
#   contaminated real diarization (Stage A)    -0.49 dB
#
# Three independent negatives, and they still do not establish "never positive"
# -- accumulating negatives never can. Worse, the mechanism explains the pattern
# without settling it: refinement blends 0.5*e_enrolled + 0.5*e_from_extracted,
# and the second term is embedded from G's output, which sits at ~1.7 dB at
# depth 2. Bad conditioning produces a bad candidate, so every test may be
# landing negative because of the EXTRACTOR rather than because of refinement.
#
# Replacing the acceptance rule with one that cannot be wrong separates the two,
# and either outcome is a result:
#
#   * ceiling still negative -> refinement has no headroom on this extractor.
#     A publishable negative result with a stated mechanism, not an open
#     question. `refine.rounds: 0` becomes final.
#   * ceiling positive, real gate cannot find it -> the acceptance RULE is what
#     is broken, not refinement. Levers then, in order: a variance-weighted
#     blend instead of the fixed 0.5/0.5 (a noisy candidate down-weights
#     itself, so it needs no benefit test), and embedding the lowest-depth
#     frames rather than the longest overlap run.
#
# WHERE THE ANSWER IS. Two places, and read both:
#   1. `coarse_to_fine` minus `no_recursion` in the absolute table. The other
#      three systems never refine, so they are unaffected by the ceiling and
#      remain a valid control WITHIN this run -- no cross-run comparison needed.
#   2. The gate section's reason counts. `ceiling_accept_gate_would_reject` is
#      exactly the headroom the deployable gate could not reach; if that count
#      is ~0, the gate was already making the right calls and refinement's
#      deficit is not an acceptance problem at all.
#
#
# RECONCILED 2026-08-20. The Stage B run-1 results in
# results/phase3/experiments/experiment_stage_B_run_1/ were produced by a Kaggle
# notebook that mutated this config IN-KERNEL (to fit a measured 120 s/unit cost
# into the session budget) and never wrote the mutation back. The committed
# numbers therefore did not regenerate from the committed config -- a §7
# violation ("no numbers that can't be regenerated by one command"). The values
# below are now exactly what ran. If a future run needs different ones, add a
# NEW config rather than editing this one, or the committed results stop
# reproducing again.
#
# NOTE on what re-running this now produces. Run 1's ceiling numbers are VOID:
# `make_oracle_accept_fn` scored candidates on the WHOLE waveform while the table
# reported depth 2, so the "ceiling" came in BELOW `no_recursion` -- a bound that
# cannot lose, losing. Fixed 2026-08-20 (the rule now masks with `scoring_depth`,
# the same slice `si_sdr_by_depth` reports). So this config regenerates the run-1
# CONDITIONS, and with the corrected code it yields the CORRECTED answer. That is
# the intended behaviour: the config did not change, the code did.
#   DAGGER_DATA_ROOT=/kaggle/working/data python scripts/run_phase3.py \
#       --config configs/phase3/experiments/phase3_librimix_3spk_refine_ceiling.yaml

sample_rate: 8000
fade_ms: 5

# Identical corpus to the Stage A baseline and to B1, so all three pair row by
# row on (scene, speaker, depth, system).
dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test_long.csv
  n_src: 3
  placement: chain
  overlap: 0.3
  min_solo_ms: 1000.0
  limit: 25
  diarizer_sample_rate: 16000

diarizer:
  name: pyannote
  model: pyannote/speaker-diarization-community-1
  # oracle + real. Refinement's cost differed between them in Stage A
  # (-0.69 dB oracle vs -0.49 dB real), so the ceiling is measured under both to
  # see whether contamination is what refinement needs to pay off.
  # `real_index_order` is dropped: it decomposes the V_i reordering, which this
  # run does not ask about, and refinement takes no deflation order anyway.
  arms: [oracle, real]

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  # Must be > 0 or the ceiling measures nothing; run_phase3.py refuses the
  # combination rather than writing a complete-looking table of no-ops.
  rounds: 2
  oracle_ceiling: true

eval:
  results_dir: results/phase3/experiments
  tag: refine_ceiling
