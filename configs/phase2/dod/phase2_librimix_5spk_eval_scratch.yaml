# Eval against the SCRATCH-trained curriculum checkpoint
# (configs/phase2/dod/phase2_librimix_curriculum_3_4_5_train_scratch.yaml -- no warm start,
# so this checkpoint is reproducible from one command).
# Writes results/phase2_librimix_5spk_scratch345.{csv,md} + _gate.csv.

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test_x5.csv
  n_src: 5
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 150

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  # Writes straight into the DoD results dir -- the 2026-08-09 outputs had to
  # be moved here by hand afterwards.
  results_dir: results/phase2/dod
  # Distinct from the 2026-08-09 `scratch345` tag ON PURPOSE: that run is the
  # baseline this one is compared against, and a shared tag would overwrite it
  # in place. Writes
  # results/phase2/dod/phase2_librimix_5spk_scratch345clip50.{csv,md}
  tag: scratch345clip50
