# Scratch-trained multi-depth curriculum run -- the checkpoint Phase 2's final
# numbers are reported from.
#
# NO `train.init_checkpoint`. Every prior Phase 2 checkpoint was warm-started
# from the one before it (phase1 -> scheduled fine-tune -> depth-5 pilot ->
# curriculum pilot -> curriculum full), so reproducing the reported result meant
# replaying that whole chain. This config trains from random init so the
# checkpoint comes from ONE command, per CLAUDE.md §7 ("no numbers that can't be
# regenerated by one command").
#
# Expect absolute quality similar to or slightly below the warm-started
# checkpoint at equal compute -- that is the price of reproducibility, and it
# does not affect Phase 2's claims, which are all relative comparisons holding
# scenes, mixture, and checkpoint fixed.
#
# "Curriculum" here means batches drawn from SEVERAL overlap depths in one run
# (the `dataset:` list below), not easy-to-hard ordering. See the definition in
# CLAUDE.md §5 Phase 2.
#
# Sizing: 800 scenes/depth (2400 total) x 10 epochs, chosen so training AND the
# three evals fit in ONE session. Budgeted from the pilot's measured cost --
# 1.045 s/scene/epoch and ~0.87 s/scene one-time setup:
#   setup 2400*0.87 = 2088s + training 2400*1.045*10 = 25080s = ~27170s = 7.5h
#   evals (3/4/5 spk at 150 scenes) ~1.9h, setup ~0.3h  ->  ~9.7h total
# against the ~12h (43200s) ceiling this project has hit once before (the
# 2026-07-27 SIGKILL). 2.3h of margin, which matters because the per-scene cost
# is extrapolated from a 390-scene run.
#
# Why not more scenes: HOST RAM, not time. The prepared-scenes list OOMed at
# ~30 GB on 2000 scenes before `torch_adapter` started storing crops compactly
# (float32 audio + uint8 masks, ~3x less). The largest run known to fit is
# 650/depth = 1950 scenes; 2400 is 1.23x that, while 1000/depth = 3000 would be
# 1.54x and also push the session to ~11.6h. If you have two sessions to spend,
# 1000/depth x 10 epochs (training alone, evals in a second session) is the
# higher-exposure option.
#
# CHECK AFTER EPOCH 1: expected steady-state cost is ~2508s/epoch (~42 min); the
# 2026-08-09 run came in under that at ~38 min. If the first epoch exceeds ~50
# min, 10 epochs plus evals will not fit -- stop, drop `epochs` to 8, and
# restart. `checkpoint_every: 2` means an interrupted run still leaves a usable
# checkpoint either way.
#
# WATCH THE GRAD-NORM LINE, not just the loss. Each epoch logs
# `grad_norm: median=... max=... clipped=...%`. Healthy is a median comfortably
# below `grad_clip` with a small clipped-%. If the median climbs toward 50 and
# clipped-% marches past ~50%, the clip is throttling again and the loss
# flattening is NOT convergence -- that is the exact failure this run exists to
# rule out, and the fix then is a running-percentile clip, not a third bump.
#
# Do NOT also raise `epochs` to spend the ~3.3h of leftover headroom. This run
# changes ONE variable against 2026-08-09's, so that "the accumulation effect
# returned" can be attributed to the clip rather than to extra training -- those
# two readings imply different claims in the paper. The headroom is margin.
#
# Needs n_src=4 and n_src=5 TRAINING metadata, which Kaggle sessions do not
# persist -- regenerate both before running:
#   python scripts/extend_librimix_metadata.py \
#       --input  $DAGGER_DATA_ROOT/metadata/Libri3Mix/libri3mix_train-360.csv \
#       --output $DAGGER_DATA_ROOT/metadata/Libri3Mix/libri3mix_train-360_x4.csv \
#       --target-n-src 4
#   (and again with --target-n-src 5)

sample_rate: 8000
fade_ms: 5

# A LIST, not a dict: one loader per depth, batches interleaved in a
# per-epoch-shuffled order over one shared model and optimizer. Each batch still
# comes from exactly one loader, so it is internally uniform in num_speakers.
dataset:
  - name: librimix
    metadata: metadata/Libri3Mix/libri3mix_train-360.csv
    n_src: 3
    placement: scheduled
    min_solo_ms: 1000.0
    limit: 800
  - name: librimix
    metadata: metadata/Libri3Mix/libri3mix_train-360_x4.csv
    n_src: 4
    placement: scheduled
    min_solo_ms: 1000.0
    limit: 800
  - name: librimix
    metadata: metadata/Libri3Mix/libri3mix_train-360_x5.csv
    n_src: 5
    placement: scheduled
    min_solo_ms: 1000.0
    limit: 800

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6

train:
  system: proposed
  epochs: 10
  batch_size: 4
  segment_seconds: 4.0
  lr: 0.0003          # NOT 1e-3: at 1e-3 the optimizer never escapes the
                      # passthrough plateau (CLAUDE.md Phase 1, 2026-07-12).
  # Raised from 10.0 after the 2026-08-09 run: the median gradient norm crossed
  # 10 at epoch 6 and ended at 15.14 with 93% of steps clipped, so the last four
  # epochs were normalized-gradient descent at a shrinking step size -- a hidden
  # LR schedule, exactly what _grad_norm_summary's docstring says to raise the
  # clip for. si_sdr_loss gradients GROW as the estimate approaches the target
  # (error energy is in the denominator), so a fixed clip gets more binding the
  # better the model becomes; 10.0 was inherited from Phase 1, where it was rare
  # spike protection, and no warm-started run ever traversed the high-gradient
  # region from random init. 50 still cuts the genuine spikes hard (the observed
  # maxima were 1520/2183/896) while sitting ~3x above the previous run's final
  # median.
  grad_clip: 50.0
  checkpoint_every: 2
  checkpoint_out: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_scratch_clip50.pt
  # No init_checkpoint -- this is the point of the config.
