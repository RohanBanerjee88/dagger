# Same as phase2_librimix_5spk_eval.yaml but pointed at the pilot fine-tune's
# checkpoint (configs/phase2/experiments/phase2_librimix_5spk_train_pilot.yaml) instead of the
# zero-shot depth-3-only checkpoint. Kept as a separate config/results file
# (not overwriting the zero-shot one) so the before/after comparison survives:
# results/phase2_librimix_5spk_zeroshot5.{csv,md} is the "before" (zero-shot)
# run; this one produces results/phase2_librimix_5spk_pilot5.{csv,md}. Same
# test scenes and limit as the zero-shot run for a direct comparison.

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test_x5.csv
  n_src: 5
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 150

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_5spk_pilot.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  results_dir: results
  tag: pilot5   # writes results/phase2_librimix_5spk_pilot5.{csv,md}
