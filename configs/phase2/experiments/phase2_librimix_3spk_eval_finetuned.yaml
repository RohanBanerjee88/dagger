# Same as configs/phase2/experiments/phase2_librimix_3spk_eval.yaml, pointed at the fine-tuned
# (scheduled-placement-exposed) checkpoint instead of the original Phase 1 one.
# Kept as a separate config/results file (not overwriting the original) so the
# before/after comparison survives: results/phase2_librimix_3spk.{csv,md} is
# the "before" (Phase 1 checkpoint) run; this one produces
# results/phase2_librimix_3spk_finetuned.{csv,md}.

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test.csv
  n_src: 3
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 150

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  num_speakers: 3
  checkpoint: checkpoints/phase2/proposed_librimix_3spk_scheduled.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  results_dir: results
  tag: finetuned   # writes results/phase2_librimix_3spk_finetuned.{csv,md} -- never
                   # collides with the original results/phase2_librimix_3spk.{csv,md}
