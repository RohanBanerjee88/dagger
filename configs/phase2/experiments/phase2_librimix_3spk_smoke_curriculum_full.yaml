# Sanity-check scale (5 scenes) for the scaled-up curriculum checkpoint,
# mirroring configs/phase2/experiments/phase2_librimix_3spk_smoke_finetuned.yaml.
#
# Run this FIRST in any session that will run the three 150-scene
# configs/phase2_librimix_{3,4,5}spk_eval_curriculum_full.yaml evals: it takes
# about a minute and exercises every code path they do -- including the
# accumulation instrumentation (`m`, `deflation_index`, `n_accepted_before`) and
# the separate `<stem>_gate.csv` -- so a schema or wiring problem surfaces here
# instead of after an hour of scoring.
#
# Writes results/phase2_librimix_3spk_curriculum345full_smoke.{csv,md} plus
# _gate.csv, so it never collides with the real runs' `curriculum345full` tag.

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test.csv
  n_src: 3
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 5

enroll:
  k: 3
  min_clip_ms: 500.0

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_full.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  results_dir: results
  tag: curriculum345full_smoke
