# Enrollment-budget sweep point: 300 ms of solo audio per enrollment clip.
#
# Tests whether coarse-to-fine refinement pays once the solo-derived embedding is
# the WEAKER estimate. Refinement blends that embedding toward one computed from
# extracted overlap audio; with the full ~1 s of clean solo the solo embedding
# already wins, so blending toward the noisier estimate costs 0.2-1.1 dB (the
# 2026-08-03 result). Starving enrollment is the controlled way to find the
# crossover -- or to establish there isn't one.
#
# `enroll.budget_ms` truncates each selected solo clip and NOTHING else. Scene
# geometry, x_O, and the depth arrays are byte-identical across every sweep
# point, so results pair row-for-row. (dataset.min_solo_ms would also starve
# enrollment, but it changes placement, depth distribution, and achieved
# overlap, making each point a different dataset.)
#
# Read the "coarse_to_fine - no_recursion" paired table. Both systems degrade as
# the budget shrinks -- the question is only whether that difference crosses
# zero. Note enroll.min_clip_ms (500) still filters which runs qualify; the
# budget then truncates them, so a budget below 500 is intentional and does not
# reject the speaker.
#
# The unbudgeted reference point is the existing
# results/phase2_librimix_5spk_curriculum345full.* -- same config minus this key.

sample_rate: 8000
fade_ms: 5

dataset:
  name: librimix
  metadata: metadata/Libri3Mix/libri3mix_test_x5.csv
  n_src: 5
  placement: scheduled
  min_solo_ms: 1000.0
  limit: 150

enroll:
  k: 3
  min_clip_ms: 500.0
  budget_ms: 300

extractor:
  hidden_channels: 64
  n_blocks: 6
  n_fft: 256
  hop_length: 64
  n_heads: 4
  n_tokens: 8
  cross_attn_blocks: 6
  checkpoint: checkpoints/phase2/proposed_librimix_curriculum_3_4_5_full.pt

gate:
  tau_margin: 0.1
  max_mean_variance: 0.05
  min_vad_coverage: 0.5
  max_artifact_score: 0.9

refine:
  rounds: 2

eval:
  results_dir: results
  tag: budget300   # writes results/phase2_librimix_5spk_budget300.{csv,md}
